# Clickathon 2026 — one HTTPS host in front of the whole stack.
#
# Judges get a single URL instead of four ports. Certbot rewrites this file to add the TLS
# listener and certificate paths once a cert is issued.
#
# WHY LANGFUSE AND LIBRECHAT KEEP THEIR OWN PORTS:
# Both are single-page apps that assume they are served from the root of a host. Behind a
# subpath they emit absolute asset URLs (/_next/..., /assets/...) that miss the prefix and
# 404. Rewriting those reliably means patching their build config, which is not worth doing
# to a vendored image mid-hackathon. They stay on :3000 and :3080 over plain HTTP; the
# dashboard and API — the two surfaces a judge actually reads — get the domain and the cert.

server {
    listen 80;
    server_name clickathon.kangasys.com;

    # Certbot's HTTP-01 challenge must stay reachable over plain HTTP for renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name clickathon.kangasys.com;

    # ssl_certificate lines are inserted here by certbot --nginx.

    client_max_body_size 25m;

    # --- Backend API -------------------------------------------------------
    # /api/investigate -> :8000/investigate. The trailing slash on proxy_pass is what strips
    # the prefix; without it FastAPI would see /api/investigate and 404 every route.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An investigation runs 20-60 ClickHouse queries plus an LLM call. The default 60s
        # proxy timeout cuts that off mid-flight and returns a 504 for a request that was
        # about to succeed.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Chat streams as SSE; buffering would hold every token until the response ended.
        proxy_buffering off;
        proxy_cache off;
    }

    # --- Dashboard ---------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
